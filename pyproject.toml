[build-system]
requires = ["setuptools>=68,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "chucklesPRIME"
version = "0.2.0"
description = "Phonetically checked movie parodies, human review and 27B DPO"
requires-python = ">=3.10"
dependencies = [
    "smolagents==1.24.0", "huggingface-hub==0.36.0", "openai>=1", "requests>=2.28",
    "cryptography>=43", "pronouncing", "setuptools<81", "Flask>=3", "PyYAML>=6"
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]
trace-export = ["tokenizers>=0.21"]

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
markers = ["integration: requires external credentials or services"]
