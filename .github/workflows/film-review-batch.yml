name: 3. RunPod bulk generation and resume
on:
  workflow_dispatch:
    inputs:
      shards:
        description: JSON array of shards to run (0 through 7)
        default: '[0,1,2,3,4,5,6,7]'
        required: true
      slots:
        description: Simultaneous Qwen trajectories per GPU
        default: '6'
        required: true
      resume_run:
        description: Optional previous run ID to import checkpoints from
        type: string
      use_saved_sides:
        description: Reuse matching committed MovieLens checkpoints before generating remaining sides
        type: boolean
        default: false
      prompt_snapshot:
        description: Leave blank for the live audience prompt; use a historical results directory to resume its checkpoints
        default: ''
        type: string
      ranks:
        description: Optional JSON array of specific MovieLens ranks (with shards set to [0])
        default: '[]'
        type: string
permissions:
  contents: read
  actions: read
jobs:
  films:
    runs-on: ubuntu-latest
    timeout-minutes: 335
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: ${{ fromJSON(inputs.shards) }}
    env:
      PYTHONUNBUFFERED: '1'
      SHARD: ${{ matrix.shard }}
      SNAPSHOT: ${{ inputs.prompt_snapshot }}
      USE_SAVED_SIDES: ${{ inputs.use_saved_sides }}
      SPECIAL_RANKS: ${{ inputs.ranks || '[]' }}
      SHARDS: ${{ inputs.shards }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -e '.[trace-export]' 'smolagents==1.24.0' 'huggingface-hub==0.36.0' 'setuptools<81'
      - name: Restore checkpointed trajectories
        if: inputs.resume_run != ''
        uses: actions/download-artifact@v4
        with:
          name: film-shard-${{ matrix.shard }}
          run-id: ${{ inputs.resume_run }}
          github-token: ${{ github.token }}
          path: restored
      - name: Select films and prepare checkpoints
        run: |
          if [[ -n "$SNAPSHOT" ]]; then
            for file in "$SNAPSHOT/guidance.txt" "$SNAPSHOT/prompt-revision.json"; do
              [[ "$(realpath -e -- "$file")" == "$GITHUB_WORKSPACE"/results/* ]]
              git --literal-pathspecs ls-files --error-unmatch -- "$file"
            done
          else
            SNAPSHOT=out/current-prompt
            mkdir -p "$SNAPSHOT"
            PYTHONPATH=pipeline python -c 'import json; from pathlib import Path; from settings import live_revision; Path("out/current-prompt/prompt-revision.json").write_text(json.dumps(live_revision(),ensure_ascii=False,indent=2)+"\n")'
            export SNAPSHOT
            echo "SNAPSHOT=$SNAPSHOT" >> "$GITHUB_ENV"
          fi
          mkdir -p out/samples
          python - <<'PY'
          import csv,gzip,json,os,shutil,sys
          from pathlib import Path
          shard=int(os.environ['SHARD'])
          assert 0<=shard<8
          with Path('pipeline/film_lists/top200_1990_2015.csv').open() as f:
              all_films=list(csv.DictReader(f))
          selected=json.loads(os.environ['SPECIAL_RANKS'])
          if selected:
              assert json.loads(os.environ['SHARDS'])==[0]
              assert all(type(n) is int and 1<=n<=len(all_films) for n in selected)
              rows=[r for r in all_films if int(r['rank']) in selected]
          else:
              rows=all_films[shard::8]
          with Path('out/films.csv').open('w',newline='') as f:
              w=csv.DictWriter(f,rows[0]); w.writeheader(); w.writerows(rows)
          sys.path.insert(0,'pipeline')
          from generate_film_pairs import sample_signature
          from march_source import NOTEBOOK
          from run_gguf_test import MODEL
          snapshot=Path(os.environ['SNAPSHOT'])
          signature=sample_signature(snapshot/'prompt-revision.json',NOTEBOOK,MODEL)
          sources=[Path('restored/samples')]
          if os.environ['USE_SAVED_SIDES'].lower()=='true':
              base=Path('results/movielens-200')
              sources.extend([base/'samples',base/'resume'/snapshot.name])
          for row in rows:
              for side in 'ab':
                  name=f"{int(row['rank']):03}-{side}.json.gz"
                  for directory in sources:
                      candidate=directory/name
                      if not candidate.is_file(): continue
                      with gzip.open(candidate,'rt',encoding='utf-8') as f: checkpoint=json.load(f)
                      if checkpoint['signature']!=signature:
                          if directory==sources[0]: raise ValueError(f'Wrong prompt or model in restored artifact: {name}')
                          continue
                      if checkpoint['film']!=row or checkpoint['side']!=side:
                          raise ValueError(f'Wrong MovieLens film or side in {candidate}')
                      shutil.copyfile(candidate,Path('out/samples')/name)
                      break
          PY
      - name: Generate the two traced samples per film
        env:
          CHUCKLES_2025_BANK_GZ: ${{ secrets.CHUCKLES_2025_BANK_GZ }}
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          SLOTS: ${{ inputs.slots }}
        run: |
          options=()
          if [[ -f "$SNAPSHOT/guidance.txt" ]]; then options+=(--human-guidance "$SNAPSHOT/guidance.txt"); fi
          python pipeline/run_gguf_test.py "${options[@]}" \
            --pair-revision "$SNAPSHOT/prompt-revision.json" \
            --slots "$SLOTS" --titles out/films.csv --output-dir out/run --checkpoints out/samples \
            --gpu 'NVIDIA RTX PRO 6000 Blackwell Max-Q Workstation Edition,NVIDIA RTX PRO 5000 Blackwell,NVIDIA RTX 6000 Ada Generation,NVIDIA L40S,NVIDIA L40,NVIDIA RTX A6000,NVIDIA A40' --timeout-mins 310
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: film-shard-${{ matrix.shard }}
          path: out
          overwrite: true
