name: 2. Train a DPO adapter from reviews
on:
  workflow_dispatch:
    inputs:
      test_id:
        description: Suffix of the CHUCKLES_DPO_ repository secret containing the private test request
        type: string
        required: true
      dataset_file:
        description: Optional deliberately committed reviews/*.jsonl; leave blank for private training
        type: string
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check the private or tracked preferences
        env:
          DATASET_FILE: ${{ inputs.dataset_file }}
          PRIVATE_REQUEST: ${{ secrets[format('CHUCKLES_DPO_{0}', inputs.test_id)] }}
        run: |
          mkdir -p "$RUNNER_TEMP/chuckles"
          cd "$RUNNER_TEMP/chuckles"
          export PYTHONPATH="$GITHUB_WORKSPACE"
          umask 077
          options=()
          if [[ -n "$DATASET_FILE" ]]; then
            file="$(realpath -e -- "$GITHUB_WORKSPACE/$DATASET_FILE")"
            [[ "$file" == "$GITHUB_WORKSPACE"/reviews/*.jsonl ]]
            git -C "$GITHUB_WORKSPACE" --literal-pathspecs ls-files --error-unmatch -- "$DATASET_FILE"
            options+=(--dataset "$file")
          fi
          python -m pipeline.review_request unpack request.json "${options[@]}"
          unset PRIVATE_REQUEST
      - uses: ./.github/actions/native-gguf
        with:
          target: dpo
      - name: Train, reload and compare on identical prompts
        run: |
          cd "$RUNNER_TEMP/chuckles"
          export PYTHONPATH="$GITHUB_WORKSPACE"
          python "$GITHUB_WORKSPACE/training/gguf_dpo/smoke.py" --input request.json --driver "$PWD/forward" --model model.gguf --work scratch --assets assets --output result
          python "$GITHUB_WORKSPACE/training/gguf_dpo/seal.py" request.json result "$RUNNER_TEMP/comparison.bin"
      - uses: actions/upload-artifact@v4
        with:
          name: sealed-dpo-test
          path: ${{ runner.temp }}/comparison.bin
          if-no-files-found: error
          retention-days: 30
