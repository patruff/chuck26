name: 2. Train a DPO adapter from reviews
on:
  workflow_dispatch:
    inputs:
      test_id:
        description: Optional key ID for a legacy sealed training request
        type: string
        required: false
      dataset_file:
        description: Optional deliberately committed reviews/*.jsonl; leave blank for private training
        type: string
      revision:
        description: Saved Hugging Face review revision (defaults to latest)
        type: string
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Load the saved reviews from Hugging Face
        if: inputs.test_id == ''
        env:
          HF_TOKEN: ${{ secrets.HUGGINGFACE_API_KEY }}
          CHUCKLES_REVIEW_DATASET: ${{ vars.CHUCKLES_REVIEW_DATASET }}
          DATA_REVISION: ${{ inputs.revision }}
          DATA_FILE: ${{ inputs.dataset_file }}
        run: |
          test -z "$DATA_FILE" || { echo "Tracked CLI requests require a key ID"; exit 1; }
          pip install -q Flask 'huggingface_hub==0.36.0'
          python scripts/pages_studio.py train-request "$RUNNER_TEMP/chuckles" --revision "$DATA_REVISION"
      - name: Check the private or tracked preferences
        if: inputs.test_id != ''
        env:
          DATASET_FILE: ${{ inputs.dataset_file }}
          PRIVATE_REQUEST: ${{ secrets[format('CHUCKLES_DPO_{0}', inputs.test_id)] }}
        run: |
          mkdir -p "$RUNNER_TEMP/chuckles"
          cd "$RUNNER_TEMP/chuckles"
          export PYTHONPATH="$GITHUB_WORKSPACE"
          umask 077
          options=()
          if [[ -n "$DATASET_FILE" ]]; then
            file="$(realpath -e -- "$GITHUB_WORKSPACE/$DATASET_FILE")"
            [[ "$file" == "$GITHUB_WORKSPACE"/reviews/*.jsonl ]]
            git -C "$GITHUB_WORKSPACE" --literal-pathspecs ls-files --error-unmatch -- "$DATASET_FILE"
            options+=(--dataset "$file")
          fi
          python -m pipeline.review_request unpack request.json "${options[@]}"
          unset PRIVATE_REQUEST
      - uses: ./.github/actions/native-gguf
        with:
          target: dpo
      - name: Train, reload and compare on identical prompts
        run: |
          cd "$RUNNER_TEMP/chuckles"
          export PYTHONPATH="$GITHUB_WORKSPACE"
          python "$GITHUB_WORKSPACE/training/gguf_dpo/smoke.py" --input request.json --driver "$PWD/forward" --model model.gguf --work scratch --assets assets --output result
      - name: Publish the checked adapter to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HUGGINGFACE_API_KEY }}
          CHUCKLES_ADAPTER_REPO: ${{ vars.CHUCKLES_ADAPTER_REPO }}
          CHUCKLES_REVIEW_DATASET: ${{ vars.CHUCKLES_REVIEW_DATASET }}
        run: |
          pip install -q Flask 'huggingface_hub==0.36.0'
          target="$RUNNER_TEMP/chuckles"
          revision=""; if [[ -f "$target/dataset-revision.txt" ]]; then revision=$(cat "$target/dataset-revision.txt"); fi
          python scripts/pages_studio.py publish-adapter "$target/result" "$GITHUB_RUN_ID" --revision "$revision"
      - name: Seal the legacy recipient's comparison
        if: inputs.test_id != ''
        run: |
          cd "$RUNNER_TEMP/chuckles"
          python "$GITHUB_WORKSPACE/training/gguf_dpo/seal.py" request.json result "$RUNNER_TEMP/comparison.bin"
      - uses: actions/upload-artifact@v4
        if: inputs.test_id != ''
        with:
          name: sealed-dpo-test
          path: ${{ runner.temp }}/comparison.bin
          if-no-files-found: error
          retention-days: 30
