name: human-guidance

on:
  push:
    branches: [main]
    paths: [guidance/human-feedback.txt]
  workflow_dispatch:
    inputs:
      feedback_file:
        description: Tracked .txt file under guidance/ with examples and HUMAN_FEEDBACK comments
        default: guidance/human-feedback.txt
        required: true
        type: string

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      FEEDBACK_FILE: ${{ inputs.feedback_file || 'guidance/human-feedback.txt' }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Locate the feedback file
        shell: bash
        run: |
          set -euo pipefail
          [[ "$FEEDBACK_FILE" == guidance/*.txt ]]
          [[ "$(realpath -e -- "$FEEDBACK_FILE")" == "$GITHUB_WORKSPACE"/guidance/* ]]
          git --literal-pathspecs ls-files --error-unmatch -- "$FEEDBACK_FILE"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e '.[trace-export]' 'smolagents==1.24.0' 'huggingface-hub==0.36.0' 'setuptools<81'
      - name: Revise the prompt from human feedback and generate fresh parodies on RunPod
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          CHUCKLES_2025_BANK_GZ: ${{ secrets.CHUCKLES_2025_BANK_GZ }}
        run: python pipeline/run_gguf_test.py --human-guidance "$FEEDBACK_FILE" --output-dir out/human-guidance
      - name: Export turns for human review
        run: python pipeline/export_humor_candidates.py out/human-guidance/results.jsonl out/human-guidance/candidates.jsonl --run-manifest out/human-guidance/run.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: human-guidance
          path: out/human-guidance
